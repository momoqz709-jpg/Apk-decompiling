name: AI Vision APK Traffic Extraction (Gemini)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'App Package Name (e.g., com.example.app)'
        required: true
        type: string

jobs:
  ai-intercept:
    runs-on: self-hosted # MUST have /dev/kvm and Docker
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Find and Extract APK
        run: |
          FILE=$(find . -type f \( -name "*.apk" -o -name "*.xapk" -o -name "*.apkm" \) | head -n 1)
          if [ -z "$FILE" ]; then echo "::error::❌ No APK found."; exit 1; fi
          if [[ "$FILE" == *.xapk ]] || [[ "$FILE" == *.apkm ]]; then
            mkdir -p pkg_extract && unzip -q "$FILE" -d pkg_extract
            cp $(find pkg_extract -name "*.apk" -exec ls -s {} + | sort -n -r | head -1 | awk '{print $2}') target.apk
          else
            cp "$FILE" target.apk
          fi

      - name: 2. Start Android Emulator (Background)
        run: |
          docker run -d --privileged -p 5555:5555 -e DEVICE="Samsung Galaxy S10" --name android-container budtmo/docker-android:emulator_13.0
          adb connect localhost:5555 && adb wait-for-device
          while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; do sleep 2; done

      - name: 3. Setup Tools, Patch APK & Frida
        run: |
          sudo apt-get update && sudo apt-get install -y android-tools-adb wget unzip
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - && sudo apt-get install -y nodejs
          npm install -g apk-mitm
          
          # UPDATED: Install Gemini SDK and Pillow for image processing
          pip install mitmproxy frida-tools google-generativeai Pillow
          
          apk-mitm target.apk
          
          FRIDA_VERSION="16.4.5"
          wget -q "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-x86_64.xz" -O frida-server.xz
          xz -d frida-server.xz && chmod +x frida-server

      - name: 4. Inject CA, Install App & Start Frida
        run: |
          adb root && sleep 2 && adb remount
          nohup mitmdump --listen-port 8080 > /dev/null 2>&1 &
          sleep 3 && kill $!
          
          CERT_PATH="$HOME/.mitmproxy/mitmproxy-ca-cert.cer"
          HASH=$(openssl x509 -inform PEM -subject_hash_old -in $CERT_PATH | head -1)
          adb push $CERT_PATH /sdcard/${HASH}.0 && adb shell mv /sdcard/${HASH}.0 /system/etc/security/cacerts/
          adb shell chmod 644 /system/etc/security/cacerts/${HASH}.0
          
          adb install target.apk
          adb push frida-server /data/local/tmp/frida-server
          adb shell "chmod 755 /data/local/tmp/frida-server"
          adb shell "/data/local/tmp/frida-server &"

      - name: 5. Intercept Traffic & Run AI Vision Agent
        # UPDATED: Expose the GEMINI_API_KEY secret to the Python script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PKG="${{ github.event.inputs.package_name }}"
          HOST_IP=$(ip route get 1.1.1.1 | awk '{print $7}')
          
          nohup mitmdump --listen-port 8080 --set block_global=false --dump-flowhar=traffic.har > mitm.log 2>&1 &
          echo "MITM_PID=$!" >> $GITHUB_ENV
          adb shell settings put global http_proxy ${HOST_IP}:8080
          
          nohup frida -U -f $PKG -l bypass.js --no-pause > frida.log 2>&1 &
          echo "FRIDA_PID=$!" >> $GITHUB_ENV
          sleep 5 
          
          echo "🤖 Handing control over to AI Vision Agent (Gemini)..."
          python ai_agent.py

      - name: 6. Cleanup & Upload
        if: always()
        run: |
          adb shell settings put global http_proxy :0 || true
          kill ${{ env.MITM_PID }} || true
          kill ${{ env.FRIDA_PID }} || true
          docker stop android-container || true && docker rm android-container || true

      - name: Upload Network Traffic (HAR)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-traffic-har
          path: traffic.har
