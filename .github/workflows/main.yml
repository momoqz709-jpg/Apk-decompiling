name: APK Deep Analysis (GitHub Native)

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: 'Pfad zur APK im Repo'
        required: true
        default: 'app.apk'
      package_name:
        description: 'Package Name (z.B. com.example.app)'
        required: true
        default: 'com.example.app'
      test_email:
        description: 'Test Email'
        required: true
        default: 'test@example.com'
      test_password:
        description: 'Test Password'
        required: true
        default: 'TestPass123'

env:
  APK_PATH: ${{ github.event.inputs.apk_path }}
  PACKAGE: ${{ github.event.inputs.package_name }}
  TEST_EMAIL: ${{ github.event.inputs.test_email }}
  TEST_PASSWORD: ${{ github.event.inputs.test_password }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk python3-pip curl unzip jq
          pip3 install --break-system-packages mitmproxy google-generativeai Pillow requests

      - name: Start MITMProxy (Host Level)
        run: |
          mkdir -p mitm_out
          # Startet mitmproxy im Hintergrund auf dem Host
          nohup mitmdump --listen-port 8080 --set block_global=false --dump-flowhar=mitm_out/traffic.har > mitm.log 2>&1 &
          echo "Waiting for mitmproxy CA to generate..."
          for i in {1..30}; do
            if [ -f ~/.mitmproxy/mitmproxy-ca-cert.pem ]; then
              echo "✅ MITMProxy CA ready"
              break
            fi
            sleep 1
          done

      - name: Run Emulator, Install APK & AI Login
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          profile: pixel_6
          arch: x86_64
          disable-animations: true
          script: |
            set -x
            echo "📱 Emulator is ready. ADB is connected."
            
            # 1. MITM CA Inject
            echo "🔐 Injecting MITM CA..."
            adb root
            sleep 2
            adb remount
            adb push ~/.mitmproxy/mitmproxy-ca-cert.pem /sdcard/cacert.pem
            HASH=$(openssl x509 -subject_hash_old -in ~/.mitmproxy/mitmproxy-ca-cert.pem | head -n1)
            adb shell mv /sdcard/cacert.pem /system/etc/security/cacerts/$HASH.0
            adb shell chmod 644 /system/etc/security/cacerts/$HASH.0
            
            # 2. Proxy setzen
            echo "🌐 Setting HTTP Proxy..."
            adb shell settings put global http_proxy 127.0.0.1:8080

            # 3. Frida Setup
            echo "🕷️ Setting up Frida..."
            FRIDA_VERSION="16.4.5"
            curl -sL -o frida-server.xz "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-x86_64.xz"
            xz -d frida-server.xz
            chmod +x frida-server
            adb push frida-server /data/local/tmp/
            adb shell "chmod 755 /data/local/tmp/frida-server"
            adb shell "nohup /data/local/tmp/frida-server > /data/local/tmp/frida.log 2>&1 &"
            sleep 3

            # 4. APK Install
            echo "📦 Installing APK..."
            adb install -r -g "${{ env.APK_PATH }}" || adb shell pm install -r -d -t -g /data/local/tmp/app.apk

            # 5. AI Login Agent Script
            echo "🤖 Starting AI Vision Login Agent..."
            cat > ai_login.py << 'PYEOF'
            import os, time, json, subprocess
            import google.generativeai as genai
            from PIL import Image

            genai.configure(api_key=os.environ.get("GEMINI_API_KEY"))
            model = genai.GenerativeModel("gemini-2.0-flash")
            
            PACKAGE = os.environ.get("PACKAGE")
            EMAIL = os.environ.get("TEST_EMAIL")
            PASSWORD = os.environ.get("TEST_PASSWORD")
            ADB = ["adb"]

            def sh(args):
                return subprocess.run(ADB + args, capture_output=True, text=True)

            def screenshot():
                sh(["shell", "screencap", "-p", "/sdcard/screen.png"])
                sh(["pull", "/sdcard/screen.png", "screen.png"])
                return Image.open("screen.png")

            def ask_ai(prompt, img):
                try:
                    r = model.generate_content([prompt, img], generation_config=genai.GenerationConfig(response_mime_type="application/json"))
                    return json.loads(r.text)
                except Exception as e:
                    print(f"AI Error: {e}")
                    return None

            # SSL Bypass Script
            bypass_js = """
            Java.perform(function () {
                try {
                    var TMI = Java.use('com.android.org.conscrypt.TrustManagerImpl');
                    TMI.checkTrustedRecursive.implementation = function () { return Java.use("java.util.ArrayList").$new(); };
                } catch (e) {}
                try {
                    var CP = Java.use('okhttp3.CertificatePinner');
                    CP.check.overload('java.lang.String', 'java.util.List').implementation = function() {};
                } catch (e) {}
            });
            """
            with open("bypass.js", "w") as f:
                f.write(bypass_js)

            # Start App with Frida
            subprocess.Popen(["frida", "-U", "-f", PACKAGE, "-l", "bypass.js", "--no-pause"], 
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
            print("Waiting for app to initialize...")
            time.sleep(10)

            for step in range(15):
                img = screenshot()
                prompt_text = "Analysiere Screen. JSON: " + '{"action":"tap_email|tap_password|tap_login|wait|success|dismiss_dialog","x":N,"y":N,"reason":"..."}' + ". Regeln: Login -> Email -> Passwort -> Login. Dialog -> dismiss. Splash -> wait. Home -> success. Email: " + EMAIL + ", Password: " + PASSWORD
                result = ask_ai(prompt_text, img)
                if not result:
                    time.sleep(2)
                    continue
                
                a = result.get("action", "wait")
                x = result.get("x", 0)
                y = result.get("y", 0)
                print(f"Step {step}: {a} at ({x},{y})")
                
                if a == "success":
                    print("✅ Login successful!")
                    break
                if a == "wait":
                    time.sleep(3)
                    continue
                if x > 0 and y > 0:
                    sh(["shell", "input", "tap", str(x), str(y)])
                    time.sleep(1)
                    if a == "tap_email":
                        sh(["shell", "input", "text", EMAIL])
                        sh(["shell", "input", "keyevent", "66"])
                    elif a == "tap_password":
                        sh(["shell", "input", "text", PASSWORD])
                        sh(["shell", "input", "keyevent", "66"])
                    time.sleep(2)
            
            # Warte damit alle Netzwerk-Requests durchgehen
            print("Waiting for final network requests...")
            time.sleep(5)
            PYEOF
            
            python3 ai_login.py

      - name: Stop MITMProxy & Export Traffic
        run: |
          # Beende mitmproxy sauber, damit die HAR-Datei geschrieben wird
          pkill -f mitmdump || true
          sleep 3
          
          # Konvertiere HAR in lesbares JSON für die Analyse
          python3 << 'PYEOF'
          import json, os, re
          
          flows = []
          if os.path.exists("mitm_out/traffic.har"):
              with open("mitm_out/traffic.har", "r") as f:
                  har_data = json.load(f)
                  for entry in har_data.get("log", {}).get("entries", []):
                      req = entry.get("request", {})
                      flows.append({
                          "method": req.get("method"),
                          "url": req.get("url"),
                          "headers": {h["name"]: h["value"] for h in req.get("headers", [])},
                          "body": req.get("postData", {}).get("text", "")
                      })
          
          with open("traffic.json", "w") as f:
              json.dump(flows, f, indent=2)
          print(f"Exported {len(flows)} requests to traffic.json")
          PYEOF

      - name: APK Decompilation (Static Analysis)
        run: |
          echo "🔬 Decompiling APK..."
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          java -jar apktool.jar d "${{ env.APK_PATH }}" -o apktool-output -f || true
          
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip -O jadx.zip
          unzip -q jadx.zip -d jadx && chmod +x jadx/bin/jadx
          ./jadx/bin/jadx -d jadx-output --show-bad-code "${{ env.APK_PATH }}"

      - name: Deep Parameter Analysis & Validation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > analyze_and_validate.py << 'PYEOF'
          import os, re, json, glob, time, hashlib, hmac, uuid, secrets
          from datetime import datetime
          import google.generativeai as genai

          genai.configure(api_key=os.environ.get("GEMINI_API_KEY"))
          model = genai.GenerativeModel("gemini-2.0-flash")

          print("🧠 Starting Deep Analysis...")
          
          # 1. Traffic laden
          traffic = json.load(open("traffic.json")) if os.path.exists("traffic.json") else []
          
          # 2. Code durchsuchen
          code_files = glob.glob("jadx-output/**/*.java", recursive=True) + glob.glob("apktool-output/smali*/**/*.smali", recursive=True)
          patterns = {
              'timestamp': [r'System\.currentTimeMillis\(\)'],
              'uuid': [r'UUID\.randomUUID\(\)'],
              'nonce': [r'SecureRandom'],
              'hash': [r'MessageDigest\.getInstance\(["\']([^"\']+)["\']\)'],
              'hmac': [r'Mac\.getInstance\(["\']([^"\']+)["\']\)'],
              'encryption': [r'SecretKeySpec', r'Cipher\.getInstance']
          }
          
          findings = {c: [] for c in patterns}
          for fp in code_files[:200]: # Limitieren für Geschwindigkeit
              try:
                  with open(fp, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                  for cat, pats in patterns.items():
                      for pat in pats:
                          for m in re.finditer(pat, content, re.I):
                              ctx = content[max(0,m.start()-400):min(len(content),m.end()+400)].strip()
                              findings[cat].append({'file': fp, 'pattern': pat, 'context': ctx})
              except: pass
              
          summary = {c: len(i) for c, i in findings.items()}
          
          # 3. Gemini Code Intelligence für fehlende Logik
          reanalysis = []
          login_req = next((f for f in traffic if any(k in f.get('url','').lower() for k in ['login','auth','token'])), None)
          
          if login_req and summary.get('hmac', 0) > 0:
              prompt = f"""Du bist ein Android Reverse Engineering Experte.
              App: {os.environ.get('PACKAGE')}
              Login Request URL: {login_req.get('url')}
              
              Hier sind HMAC/Crypto Fundstellen im Code:
              {chr(10).join([f['context'][:500] for f in findings['hmac'][:2]])}
              
              AUFGABE: Erkläre exakt, wie die Signatur generiert wird (Secret Key, Message-Reihenfolge, Algorithmus).
              Gib einen Python-Code-Block zurück, der dies 1:1 repliziert.
              
              Antworte NUR im JSON-Format:
              """ + '{"explanation": "...", "python_code": "...", "confidence": "high/medium/low"}'
              
              try:
                  resp = model.generate_content([prompt], generation_config=genai.GenerationConfig(response_mime_type="application/json"))
                  reanalysis.append(json.loads(resp.text))
              except Exception as e:
                  reanalysis.append({"error": str(e)})

          # 4. Report generieren
          report = ["=" * 80, "CONFIRMED GENERATION LOGIC - FINAL REPORT", "=" * 80, f"Generated: {datetime.now()}", ""]
          
          report.append("SECTION 1: CODE ANALYSIS SUMMARY")
          for cat, count in summary.items():
              if count > 0: report.append(f"  - {cat.upper()}: {count} findings")
          report.append("")
          
          report.append("SECTION 2: CAPTURED TRAFFIC (Login)")
          if login_req:
              report.append(f"URL: {login_req.get('url')}")
              report.append(f"Method: {login_req.get('method')}")
              report.append("Headers:")
              for k, v in list(login_req.get('headers', {}).items())[:10]:
                  report.append(f"  {k}: {v}")
              report.append(f"Body: {login_req.get('body', '')[:500]}")
          else:
              report.append("No login traffic captured.")
          report.append("")
          
          report.append("SECTION 3: AI REPLICATION LOGIC")
          if reanalysis:
              for i, res in enumerate(reanalysis):
                  if "error" not in res:
                      report.append(f"Analysis {i+1}:")
                      report.append(f"Explanation: {res.get('explanation')}")
                      report.append(f"Confidence: {res.get('confidence')}")
                      report.append("Python Code:")
                      report.append(res.get('python_code'))
          else:
              report.append("No specific replication logic generated (insufficient traffic or code matches).")
          report.append("")
          
          report.append("=" * 80)
          
          with open("CONFIRMED_LOGIC.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(report))
              
          # Speichere auch JSON für Artefakte
          json.dump({"findings": findings, "summary": summary, "reanalysis": reanalysis, "traffic_sample": login_req}, 
                    open("analysis_data.json", "w"), indent=2)
          
          print("✅ Analysis complete. Report saved to CONFIRMED_LOGIC.txt")
          PYEOF
          
          python3 analyze_and_validate.py

      - name: Save Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-deep-analysis
          path: |
            CONFIRMED_LOGIC.txt
            analysis_data.json
            traffic.json
            mitm_out/traffic.har
          if-no-files-found: warn
          retention-days: 30
