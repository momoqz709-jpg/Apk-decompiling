name: Ultimate APK Analysis (Redroid + Gemini Vision)

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: 'APK path in repo'
        required: true
        default: 'app.apk'
      package_name:
        description: 'App package name'
        required: true
        default: 'com.example.app'
      test_email:
        description: 'Test email for login'
        required: true
        default: 'testuser@gmail.com'
      test_password:
        description: 'Test password for login'
        required: true
        default: 'SecurePassword123!'

env:
  APK_PATH: ${{ github.event.inputs.apk_path }}
  PACKAGE: ${{ github.event.inputs.package_name }}
  TEST_EMAIL: ${{ github.event.inputs.test_email }}
  TEST_PASSWORD: ${{ github.event.inputs.test_password }}
  DEBIAN_FRONTEND: noninteractive

jobs:
  ai-capture-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: System Setup (Kernel + Tools + Python)
        run: |
          set -euxo pipefail
          sudo rm -f /etc/apt/sources.list.d/*chrome*
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            android-tools-adb python3-pip openssl unzip curl jq \
            linux-modules-extra-$(uname -r) openjdk-17-jdk wget

          # Binder setup
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null || true
          if [ ! -e /dev/binder ]; then
            sudo mkdir -p /dev/binderfs
            sudo mount -t binder binder /dev/binderfs 2>/dev/null || true
            for d in binder hwbinder vndbinder; do
              sudo ln -sf /dev/binderfs/$d /dev/$d 2>/dev/null || true
            done
          fi
          sudo chmod 666 /dev/binder /dev/hwbinder /dev/vndbinder /dev/binderfs/* 2>/dev/null || true

          pip3 install -q --break-system-packages \
            frida-tools mitmproxy google-genai Pillow requests
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Write Frida SSL Bypass Hook
        run: |
          cat > universal_ssl_bypass.js << 'EOF'
          Java.perform(function () {
            console.log("=== UNIVERSAL SSL-PINNING BYPASS ACTIVE ===");
            var bypasses = [
              function() {
                var TMI = Java.use('com.android.org.conscrypt.TrustManagerImpl');
                TMI.checkTrustedRecursive.implementation = function() {
                  return Java.use("java.util.ArrayList").$new();
                };
              },
              function() {
                var CP = Java.use('okhttp3.CertificatePinner');
                CP.check.overload('java.lang.String','java.util.List').implementation = function(){};
              },
              function() {
                var SC = Java.use('javax.net.ssl.SSLContext');
                SC.init.implementation = function(km, tm, sr) {
                  var TM = Java.use('javax.net.ssl.X509TrustManager');
                  var NullTM = Java.registerClass({
                    name: 'com.bypass.NullTrustManager',
                    implements: [TM],
                    methods: {
                      checkClientTrusted: function(chain, authType){},
                      checkServerTrusted: function(chain, authType){},
                      getAcceptedIssuers: function(){ return []; }
                    }
                  });
                  this.init(km, [NullTM.$new()], sr);
                };
              }
            ];
            bypasses.forEach(function(fn) { try { fn(); } catch(e) {} });
          });
          EOF

      - name: Launch Docker Stack (Redroid + mitmproxy)
        run: |
          set -euxo pipefail
          docker network create analysis-net 2>/dev/null || true

          # Redroid with retry
          for i in 1 2 3; do
            docker run -d --name redroid --privileged \
              -v /dev/binder:/dev/binder \
              -v /dev/hwbinder:/dev/hwbinder \
              -v /dev/vndbinder:/dev/vndbinder \
              --network analysis-net \
              redroid/redroid:11.0.0-latest \
              androidboot.hardware=redroid \
              androidboot.redroid_gpu_mode=guest \
              androidboot.redroid_width=1080 \
              androidboot.redroid_height=1920 \
              androidboot.redroid_dpi=420 && break
            docker rm -f redroid 2>/dev/null || true
            sleep 5
          done

          mkdir -p mitm_out screenshots ui_dumps
          chmod 777 mitm_out

          # mitmproxy with retry
          for i in 1 2 3 4 5; do
            docker run -d --name mitmproxy --network analysis-net \
              -p 8080:8080 \
              -e HOME=/home/mitmproxy \
              -v "$PWD/mitm_out:/home/mitmproxy/out" \
              mitmproxy/mitmproxy:latest \
              mitmdump \
                -w /home/mitmproxy/out/flows.mitm \
                --listen-port 8080 \
                --ssl-insecure \
                --set block_global=false \
                --set confdir=/home/mitmproxy/.mitmproxy && break
            docker rm -f mitmproxy 2>/dev/null || true
            sleep 5
          done

      - name: Install mitmproxy CA into Android System Store
        run: |
          # Wait for cert
          for i in $(seq 1 60); do
            docker exec mitmproxy test -f /home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem 2>/dev/null && break
            sleep 1
          done

          mkdir -p cacerts
          docker exec mitmproxy cat /home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem > cacerts/cacert.pem
          HASH=$(openssl x509 -subject_hash_old -in cacerts/cacert.pem | head -1)
          cp cacerts/cacert.pem "cacerts/${HASH}.0"

          docker exec redroid sh -c "mount -o remount,rw /system 2>/dev/null || true; mkdir -p /system/etc/security/cacerts"
          docker cp "cacerts/${HASH}.0" redroid:/system/etc/security/cacerts/
          docker exec redroid chmod 644 /system/etc/security/cacerts/*

      - name: ADB Connect + Configure Proxy
        run: |
          set -euxo pipefail
          REDROID_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' redroid)
          MITM_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mitmproxy)
          echo "TARGET_DEVICE=${REDROID_IP}:5555" >> $GITHUB_ENV
          echo "ANDROID_SERIAL=${REDROID_IP}:5555" >> $GITHUB_ENV
          echo "MITM_IP=${MITM_IP}" >> $GITHUB_ENV

          adb kill-server || true
          adb start-server

          # Wait for ADB device
          for i in $(seq 1 45); do
            adb connect "${REDROID_IP}:5555" 2>/dev/null || true
            STATE=$(adb -s "${REDROID_IP}:5555" get-state 2>/dev/null | tr -d '\r')
            [ "$STATE" = "device" ] && break
            sleep 2
          done
          [ "$STATE" = "device" ] || { echo "::error::ADB connection failed"; exit 1; }

          # Wait for full boot
          for i in $(seq 1 90); do
            BOOT=$(adb -s "${REDROID_IP}:5555" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOT" = "1" ] && break
            sleep 2
          done

          adb -s "${REDROID_IP}:5555" shell settings put global http_proxy "${MITM_IP}:8080"

      - name: Deploy Frida Server + Install APK
        run: |
          set -euxo pipefail
          FRIDA_VERSION=$(curl -sf https://api.github.com/repos/frida/frida/releases/latest | jq -r .tag_name)
          curl -fL -o frida-server.xz \
            "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-x86_64.xz"
          unxz -f frida-server.xz
          chmod +x frida-server

          adb -s "$TARGET_DEVICE" root 2>/dev/null || true
          sleep 3
          adb connect "$TARGET_DEVICE" || true
          adb -s "$TARGET_DEVICE" wait-for-device

          adb -s "$TARGET_DEVICE" push frida-server /data/local/tmp/
          adb -s "$TARGET_DEVICE" shell "chmod 755 /data/local/tmp/frida-server && nohup /data/local/tmp/frida-server > /data/local/tmp/frida.log 2>&1 &"
          sleep 5

          [ -f "$APK_PATH" ] || git lfs pull || true
          adb -s "$TARGET_DEVICE" install -r -g "$APK_PATH" 2>/dev/null || {
            adb -s "$TARGET_DEVICE" push "$APK_PATH" /data/local/tmp/app.apk
            adb -s "$TARGET_DEVICE" shell "pm install -r -d -t -g /data/local/tmp/app.apk; rm -f /data/local/tmp/app.apk"
          }
          adb -s "$TARGET_DEVICE" shell logcat -c

      - name: Gemini Vision Login Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -x
          nohup frida -D "$TARGET_DEVICE" -f "$PACKAGE" \
            -l universal_ssl_bypass.js \
            -o frida_output.log > frida_stdout.log 2>&1 &
          FRIDA_PID=$!
          sleep 12

          python3 - << 'PYEOF'
import os, time, json, subprocess, io
from google import genai
from google.genai import types
from PIL import Image

print("[VisionAI] Initializing...")
client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
SERIAL  = os.environ["TARGET_DEVICE"]
PACKAGE = os.environ["PACKAGE"]
EMAIL   = os.environ["TEST_EMAIL"]
PASSWORD= os.environ["TEST_PASSWORD"]
ADB = ["adb", "-s", SERIAL]

def sh(*args):
    return subprocess.run(ADB + list(args), capture_output=True, text=True)

def screenshot():
    sh("shell", "screencap", "-p", "/sdcard/screen.png")
    sh("pull", "/sdcard/screen.png", "screen.png")
    return Image.open("screen.png")

def ask(prompt, img):
    try:
        buf = io.BytesIO()
        img.save(buf, format="PNG")
        part = types.Part.from_bytes(data=buf.getvalue(), mime_type="image/png")
        resp = client.models.generate_content(
            model="gemini-2.0-flash",
            contents=[prompt, part],
            config=types.GenerateContentConfig(
                response_mime_type="application/json",
                timeout=30.0
            )
        )
        return json.loads(resp.text)
    except Exception as e:
        print(f"[VisionAI] Error: {e}")
        return None

PROMPT = (
    f"Analyse this Android screenshot of {PACKAGE}. "
    "Return ONLY JSON: "
    '{"action":"tap_email|tap_password|tap_login|wait|success|dismiss_dialog","x":<px>,"y":<px>,"reason":"<text>"} '
    "Rules: splash/loading→wait; dialog→dismiss_dialog; "
    "login screen→tap fields in order; home/dashboard→success. "
    f"Email={EMAIL} Password={PASSWORD}"
)

sh("shell", "am", "force-stop", PACKAGE)
time.sleep(2)
sh("shell", "monkey", "-p", PACKAGE, "1")
time.sleep(10)

for step in range(20):
    print(f"\n[VisionAI] Step {step}")
    img = screenshot()
    img.save(f"screenshots/step_{step:02d}.png")
    r = ask(PROMPT, img)
    if not r:
        time.sleep(3)
        continue
    action, x, y = r.get("action","wait"), r.get("x",0), r.get("y",0)
    print(f"  → {action} @ ({x},{y})  {r.get('reason','')}")
    if action == "success":
        print("[VisionAI] Login complete!")
        break
    elif action == "wait":
        time.sleep(4)
    elif action == "dismiss_dialog":
        sh("shell", "input", "tap", str(x), str(y))
        time.sleep(2)
    elif action in ("tap_email","tap_password","tap_login"):
        if x > 0 and y > 0:
            sh("shell", "input", "tap", str(x), str(y))
            time.sleep(1)
            if action == "tap_email":
                sh("shell", "input", "text", EMAIL)
                sh("shell", "input", "keyevent", "66")
            elif action == "tap_password":
                sh("shell", "input", "text", PASSWORD)
                sh("shell", "input", "keyevent", "66")
            time.sleep(2)

print("[VisionAI] Waiting for final network requests...")
time.sleep(15)
PYEOF
          kill $FRIDA_PID 2>/dev/null || true

      - name: Export Network Traffic
        run: |
          python3 - << 'PYEOF'
import json, subprocess, re, os

out_flows, out_txt = "traffic.json", "traffic_complete.txt"

if not os.path.exists("mitm_out/flows.mitm"):
    for f, d in [(out_txt,"No traffic captured."),(out_json,"[]")]:
        open(f,"w").write(d)
    raise SystemExit(0)

r = subprocess.run(
    ["mitmdump","-n","-r","mitm_out/flows.mitm","--set","flow_detail=3"],
    capture_output=True, text=True
)

with open(out_txt,"w") as f:
    subprocess.run(
        ["mitmdump","-n","-r","mitm_out/flows.mitm","--flow-detail","3"],
        stdout=f
    )

flows, cur = [], None
for line in r.stdout.splitlines():
    if ">>" in line and any(m in line for m in ["GET","POST","PUT","PATCH","DELETE"]):
        if cur: flows.append(cur)
        m = re.search(r'>>\s+(\w+)\s+(.+)', line)
        if m: cur = {"method": m.group(1), "url": m.group(2), "headers": {}, "body": ""}
    elif cur and ": " in line and not line.startswith("    "):
        k, v = line.split(": ", 1)
        cur["headers"][k.strip()] = v.strip()
    elif cur and line.strip() and not line.startswith(">>"):
        cur["body"] += line + "\n"
if cur: flows.append(cur)

with open(out_flows,"w") as f:
    json.dump(flows, f, indent=2)
print(f"Exported {len(flows)} flows")
PYEOF

      - name: APK Static Decompilation (apktool + jadx)
        continue-on-error: true
        run: |
          [ -f "$APK_PATH" ] || { echo "APK not found, skipping."; exit 0; }
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          java -jar apktool.jar d "$APK_PATH" -o apktool-output -f 2>/dev/null || true
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip -O jadx.zip
          unzip -q jadx.zip -d jadx && chmod +x jadx/bin/jadx
          ./jadx/bin/jadx -d jadx-output --show-bad-code "$APK_PATH" 2>/dev/null || true

      - name: Deep Static + Traffic Parameter Analysis
        continue-on-error: true
        run: |
          python3 - << 'PYEOF'
import os, re, json, glob

traffic = json.load(open("traffic.json")) if os.path.exists("traffic.json") else []

code_files = (
    glob.glob("jadx-output/**/*.java", recursive=True) +
    glob.glob("apktool-output/smali*/**/*.smali", recursive=True)
)

PATTERNS = {
    "timestamp":  [r'System\.currentTimeMillis\(\)', r'new Date\(\)'],
    "uuid":       [r'UUID\.randomUUID\(\)'],
    "nonce":      [r'SecureRandom', r'Random\.nextBytes'],
    "hash":       [r'MessageDigest\.getInstance\(["\']([^"\']+)["\']\)'],
    "hmac":       [r'Mac\.getInstance\(["\']([^"\']+)["\']\)', r'HmacSHA'],
    "signature":  [r'Signature\.getInstance'],
    "encryption": [r'Cipher\.getInstance', r'SecretKeySpec'],
    "encoding":   [r'Base64\.(encode|decode)', r'URLEncoder\.encode'],
    "device_id":  [r'Settings\.Secure\.ANDROID_ID', r'Build\.SERIAL'],
    "network":    [r'OkHttpClient', r'Retrofit', r'addInterceptor'],
}

findings = {c: [] for c in PATTERNS}
for fp in code_files:
    try:
        content = open(fp, encoding="utf-8", errors="ignore").read()
        for cat, pats in PATTERNS.items():
            for pat in pats:
                for m in re.finditer(pat, content, re.I):
                    ctx = content[max(0, m.start()-500):m.end()+500].strip()
                    findings[cat].append({"file": fp, "pattern": pat, "context": ctx})
    except Exception:
        pass

summary = {c: len(v) for c, v in findings.items()}
json.dump({"findings": findings, "summary": summary, "traffic": traffic},
          open("findings.json","w"), indent=2)
print(f"Analysis complete: {sum(summary.values())} patterns across {len(code_files)} files")
PYEOF

      - name: AI Final Validation & Replication Report
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'PYEOF'
import os, json
from datetime import datetime
from google import genai
from google.genai import types

client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
data = json.load(open("findings.json")) if os.path.exists("findings.json") else {}
traffic = data.get("traffic", [])
findings = data.get("findings", {})
summary  = data.get("summary", {})

login_req = next(
    (f for f in traffic if any(k in f.get("url","").lower() for k in ["login","auth","token","session"])),
    None
)

lines = [
    "=" * 80,
    "CONFIRMED GENERATION LOGIC — FINAL REPORT",
    "=" * 80,
    f"Generated : {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}",
    f"Package   : {os.environ.get('PACKAGE')}",
    "",
    "── SECTION 1: CAPTURED LOGIN TRAFFIC ──",
]

if login_req:
    lines += [
        f"URL    : {login_req['url']}",
        f"Method : {login_req['method']}",
        "Headers:",
        *[f"  {k}: {v}" for k,v in list(login_req.get("headers",{}).items())[:15]],
        f"Body   : {login_req.get('body','')[:500]}",
    ]
else:
    lines.append("No login traffic captured.")

lines += ["", "── SECTION 2: CODE ANALYSIS SUMMARY ──"]
lines += [f"  {c.upper():<12}: {n}" for c, n in summary.items() if n > 0]

lines += ["", "── SECTION 3: AI REPLICATION LOGIC ──"]

if login_req and summary.get("hmac", 0) > 0:
    snippets = "\n\n".join(
        f"--- {f['file']} ---\n{f['context']}"
        for f in findings.get("hmac",[])[:3]
    )
    prompt = (
        f"You are an expert Android reverse engineer.\n"
        f"App: {os.environ.get('PACKAGE')}\n"
        f"Login URL: {login_req['url']}\n"
        f"Sample body: {login_req.get('body','')[:300]}\n\n"
        f"HMAC/Crypto code locations:\n{snippets}\n\n"
        "Task: Explain exactly how the dynamic signature parameters are generated "
        "and return Python code that replicates the signing logic 1:1.\n"
        'Return ONLY JSON: {"explanation":"...","python_code":"...","secret_key":"...","confidence":"high|medium|low"}'
    )
    try:
        resp = client.models.generate_content(
            model="gemini-2.0-flash",
            contents=[prompt],
            config=types.GenerateContentConfig(
                response_mime_type="application/json",
                timeout=60.0
            )
        )
        a = json.loads(resp.text)
        lines += [
            f"Algorithm  : {a.get('explanation','N/A')}",
            f"Secret Key : {a.get('secret_key','Not found')}",
            f"Confidence : {a.get('confidence','N/A')}",
            "",
            "── Python Replication Code ──",
            a.get("python_code","# No code generated"),
        ]
    except Exception as e:
        lines.append(f"AI Analysis Error: {e}")
else:
    lines.append("No HMAC patterns found or no traffic to analyze.")

lines.append("\n" + "=" * 80)
out = "\n".join(lines)
open("CONFIRMED_LOGIC.txt","w",encoding="utf-8").write(out)
print(out)
PYEOF

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-apk-analysis-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            CONFIRMED_LOGIC.txt
            traffic_complete.txt
            traffic.json
            findings.json
            frida_output.log
            frida_stdout.log
            screenshots/

      - name: Cleanup
        if: always()
        run: |
          docker stop redroid mitmproxy 2>/dev/null || true
          docker rm   redroid mitmproxy 2>/dev/null || true
          docker network rm analysis-net 2>/dev/null || true
          adb kill-server 2>/dev/null || true
